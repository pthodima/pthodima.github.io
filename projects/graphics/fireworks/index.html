  </script> </head> <body class="fixed-top-nav "> <header> <nav id="navbar" class="navbar navbar-light navbar-expand-sm fixed-top" role="navigation"> <div class="container"> <a class="navbar-brand title font-weight-lighter" href="/"> Pavan Thodima </a> <button class="navbar-toggler collapsed ml-auto" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"> <span class="sr-only">Toggle navigation</span> <span class="icon-bar top-bar"></span> <span class="icon-bar middle-bar"></span> <span class="icon-bar bottom-bar"></span> </button> <div class="collapse navbar-collapse text-right" id="navbarNav"> <ul class="navbar-nav ml-auto flex-nowrap"> <li class="nav-item "> <a class="nav-link" href="/">About </a> </li> <li class="nav-item "> <a class="nav-link" href="/blog/">Blog </a> </li> <li class="nav-item "> <a class="nav-link" href="/cv/">CV </a> </li> <li class="nav-item "> <a class="nav-link" href="/notes/">Notes </a> </li> <li class="nav-item active"> <a class="nav-link" href="/projects/">Projects <span class="sr-only">(current)</span> </a> </li> <li class="nav-item"> <button id="search-toggle" title="Search" onclick="openSearchModal()"> <span class="nav-link">ctrl k <i class="ti ti-search"></i></span> </button> </li> <li class="toggle-container"> <button id="light-toggle" title="Change theme"> <i class="ti ti-sun-moon" id="light-toggle-system"></i> <i class="ti ti-moon-filled" id="light-toggle-dark"></i> <i class="ti ti-sun-filled" id="light-toggle-light"></i> </button> </li> </ul> </div> </div> </nav> </header> <div class="container mt-5" role="main"> <div class="post"> <header class="post-header"> <h1 class="post-title">Fireworks</h1> <p class="post-description">A simple fireworks simulation.</p> </header> <article> <style>.fireworks-container canvas{width:100%;max-width:800px;height:600px;background-color:black;border-radius:8px;display:block;margin:0 auto;border:1px solid black}#controls{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;max-width:800px;margin-left:auto;margin-right:auto}.control-group{display:flex;flex-direction:column;gap:5px}.control-group label{font-weight:bold;font-size:12px}.control-group input{padding:5px;max-width:100%}.control-value{font-size:12px;color:#666}</style> <div class="fireworks-container"> <canvas id="fireworksCanvas" width="800" height="600"></canvas> <div id="controls"> <div class="control-group"> <label for="fireworkDuration">Firework Duration (ms)</label> <input type="range" id="fireworkDuration" min="100" max="1000" value="300"> <span class="control-value" id="fireworkDurationValue">300</span> </div> <div class="control-group"> <label for="fireworkSpawnProb">Spawn Probability</label> <input type="range" id="fireworkSpawnProb" min="0" max="0.1" step="0.001" value="0.02"> <span class="control-value" id="fireworkSpawnProbValue">0.02</span> </div> <div class="control-group"> <label for="numParticles">Number of Particles</label> <input type="range" id="numParticles" min="10" max="200" value="70"> <span class="control-value" id="numParticlesValue">70</span> </div> <div class="control-group"> <label for="speedFirework">Firework Speed (px/ms)</label> <input type="range" id="speedFirework" min="0.1" max="2" step="0.1" value="0.8"> <span class="control-value" id="speedFireworkValue">0.8</span> </div> <div class="control-group"> <label for="speedParticle">Particle Speed (px/ms)</label> <input type="range" id="speedParticle" min="0.1" max="1" step="0.05" value="0.3"> <span class="control-value" id="speedParticleValue">0.3</span> </div> <div class="control-group"> <label for="fireworkRadius">Firework Radius</label> <input type="range" id="fireworkRadius" min="2" max="20" value="8"> <span class="control-value" id="fireworkRadiusValue">8</span> </div> <div class="control-group"> <label for="particleLifetime">Particle Lifetime (ms)</label> <input type="range" id="particleLifetime" min="100" max="1000" value="400"> <span class="control-value" id="particleLifetimeValue">400</span> </div> <div class="control-group"> <label for="gravity">Gravity (px/ms²)</label> <input type="range" id="gravity" min="0" max="0.02" step="0.0005" value="0.005"> <span class="control-value" id="gravityValue">0.005</span> </div> <div class="control-group"> <label for="particleHistoryLength">Trail Length</label> <input type="range" id="particleHistoryLength" min="0" max="100" value="40"> <span class="control-value" id="particleHistoryLengthValue">40</span> </div> <div class="control-group"> <label for="numStars">Number of Stars</label> <input type="range" id="numStars" min="0" max="500" value="100"> <span class="control-value" id="numStarsValue">100</span> </div> </div> </div> <script>
// @ts-check

// Find the canvas and start!
/** @type {HTMLCanvasElement} */
const canvas = /** @type {HTMLCanvasElement} */ (document.getElementById("fireworksCanvas"));
/** @type {CanvasRenderingContext2D} */
const ctx = /** @type {CanvasRenderingContext2D} */ canvas.getContext("2d");


/** @type {Array<{x: number, y: number, age: number, vx: number, vy: number, color: {h: number, s: number, l: number}}>} */
let fireworks = [];
/** @type {number} */
let firework_duration = 300; // milliseconds
/** @type {number} */
let firework_spawn_prob = 0.02;
/** @type {Array<{x: number, y: number, src_x: number, src_y: number, age: number, vx: number, vy: number, color: {h: number, s: number, l: number}, history: Array<[number, number]>}>} */
let particles = [];
/** @type {number} */
let num_particles = 70;
/** @type {number} */
let speed_firework = 0.8; // pixels per millisecond
/** @type {number} */
let speed_particle = 0.3; // pixels per millisecond
/** @type {number} */
let firework_radius = 8;
/** @type {number} */
let dist_eps = 5;
/** @type {number} */
let particle_lifetime = 400; // milliseconds
/** @type {number} */
let gravity = 0.005; // pixels per millisecond squared
let particle_history_length = 40;
/** @type {Array<{x: number, y: number, size: number, blinkSpeed: number, offset: number}>} */
let stars = [];
let num_stars = 100;

// Responsive canvas resize function
function resizeCanvas() {
    // Get the container's width (or window width for full width)
    const container = canvas.parentElement;
    const displayWidth = container ? container.clientWidth : window.innerWidth;
    // Set a max width (like CSS)
    const maxWidth = 800;
    const width = Math.min(displayWidth, maxWidth);
    // Maintain aspect ratio (4:3)
    const aspect = 600 / 800;
    const height = Math.round(width * aspect);
    // For crispness on high-DPI screens
    const dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform
    ctx.scale(dpr, dpr);
    // Recreate stars to fit new size
    createStars();
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function createStars() {
    stars = [];
    // Use CSS pixel size for star positions
    const width = parseFloat(canvas.style.width) || 800;
    const height = parseFloat(canvas.style.height) || 600;
    for (let i = 0; i < num_stars; i++) {
        stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2,
            blinkSpeed: 0.001 + Math.random() * 0.003,
            offset: Math.random() * Math.PI * 2,
        });
    }
}


function generateRandomColor() {
    const h = Math.floor(Math.random() * 361);
    // const s = Math.floor(Math.random() * 30) + 70;
    const s = 100;
    //   const v = Math.floor(Math.random() * 30) + 70;
    const l = 50;
    return { h: h, s: s, l: l };
}


// On mouse click, create a firework at random position at the bottom of the canvas, that moves towards the clicked position, explodes when it reaches it.
function createFirework(/** @type {number} */ mx, /** @type {number} */ my) {
    // Use CSS pixel size for logic
    const width = parseFloat(canvas.style.width) || 800;
    const height = parseFloat(canvas.style.height) || 600;
    const startX = Math.random() * width;
    const startY = height;

    const dx = mx - startX;
    const dy = my - startY;
    const vx = dx / firework_duration;
    const vy = (dy / firework_duration) - (0.5 * gravity * firework_duration);

    fireworks.push({
        x: startX,
        y: startY,
        age: 0,
        vx: vx,
        vy: vy,
        color: generateRandomColor()
    });
}

canvas.onclick = function (/** @type {MouseEvent} */ event) {
    // Use offsetX/Y which are relative to the canvas CSS size
    const rect = canvas.getBoundingClientRect();
    const width = parseFloat(canvas.style.width) || 800;
    const height = parseFloat(canvas.style.height) || 600;
    const mx = ((event.clientX - rect.left) / rect.width) * width;
    const my = ((event.clientY - rect.top) / rect.height) * height;
    createFirework(mx, my);
};

/** @type {DOMHighResTimeStamp} */
let lasttime;
function animateFireworks(/** @type {DOMHighResTimeStamp} */ timestamp) {
    if (!lasttime) lasttime = timestamp;
    const deltatime = timestamp - lasttime;
    lasttime = timestamp;

    // Use CSS pixel size for logic
    const width = parseFloat(canvas.style.width) || 800;
    const height = parseFloat(canvas.style.height) || 600;

    // update positions
    fireworks.forEach(function (firework) {
        firework.x += firework.vx * deltatime;
        firework.y += firework.vy * deltatime + 0.5 * gravity * deltatime * deltatime;
        firework.vy += gravity * deltatime;
        firework.age += deltatime;
    });

    particles.forEach((particle) => {
        particle.x += particle.vx * deltatime;
        particle.vy += 0.1 * gravity * deltatime;
        particle.y += particle.vy * deltatime;
        particle.age += deltatime;
        particle.history.push([particle.x, particle.y]);
        if (particle.history.length > particle_history_length) {
            particle.history.shift();
        }
    });

    // create particles for fireworks that reached their destination
    fireworks.forEach((firework) => {
        if (firework.age >= firework_duration && !firework.exploded) {
            firework.exploded = true;
            // create particles
            if (Math.random() < 0.3) {
                for (let i = 0; i < num_particles; i++) {
                    particles.push({
                        x: firework.x,
                        y: firework.y,
                        src_x: firework.x,
                        src_y: firework.y,
                        age: 0,
                        vx: Math.cos((i / num_particles) * 2 * Math.PI) * speed_particle,
                        vy: Math.sin((i / num_particles) * 2 * Math.PI) * speed_particle,
                        color: generateRandomColor(),
                        history: [],
                    });
                }
            }
            else {
                for (let i = 0; i < num_particles; i++) {
                    particles.push({
                        x: firework.x,
                        y: firework.y,
                        src_x: firework.x,
                        src_y: firework.y,
                        age: 0,
                        vx: Math.cos((i / num_particles) * 2 * Math.PI) * speed_particle,
                        vy: Math.sin((i / num_particles) * 2 * Math.PI) * speed_particle,
                        color: firework.color,
                        history: [],
                    });
                }
            }
        }
    })

    // Remove particles that have exceeded their lifetime
    particles = particles.filter((particle) => {
        return particle.age <= particle_lifetime;
    });

    // Remove fireworks that reached their destination or left the canvas
    fireworks = fireworks.filter((firework) => {
        return firework.age <= firework_duration;
    });

    // Draw background
    ctx.fillStyle = "black";
    ctx.fillRect(0, 0, width, height);

    // draw stars
    ctx.fillStyle = "white";
    stars.forEach((star) => {
        const alpha = 0.4 + 0.6 * Math.sin(timestamp * star.blinkSpeed + star.offset);
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, 2 * Math.PI);
        ctx.fill();
    });
    ctx.globalAlpha = 1.0;

    // draw fireworks
    fireworks.forEach((firework) => {
        ctx.beginPath();
        ctx.fillStyle = "hsl(" + firework.color.h + "," + firework.color.s + "%," + firework.color.l + "%)";
        ctx.moveTo(firework.x + firework_radius, firework.y);
        ctx.arc(firework.x, firework.y, firework_radius, 0, 2 * Math.PI);
        ctx.fill();
    });

    // draw particles
    particles.forEach((particle) => {
        const fade = 1 - (particle.age / particle_lifetime);
        const colorStr = `hsla(${particle.color.h},${particle.color.s}%,${particle.color.l}%,${fade})`;

        ctx.fillStyle = colorStr;
        ctx.strokeStyle = colorStr;
        ctx.fillRect(particle.x - 5, particle.y - 5, 10, 10);

        // Draw trail lines
        if (particle.history.length > 0) {
            ctx.beginPath();
            ctx.lineWidth = 1;
            ctx.moveTo(particle.history[0][0], particle.history[0][1]);
            for (let i = 1; i < particle.history.length; i++) {
                ctx.lineTo(particle.history[i][0], particle.history[i][1]);
            }
            ctx.stroke();
        }
    })

    window.requestAnimationFrame(animateFireworks);

    // Chance for random fireworks
    if (Math.random() < firework_spawn_prob) {
        createFirework(
            Math.random() * width,
            Math.random() * height / 2
        );
    }
}


// Stars will be created in resizeCanvas
window.requestAnimationFrame(animateFireworks);

// Setup UI controls
const controlConfig = [
    { id: "fireworkDuration", decimals: 0, setter: (v) => firework_duration = v },
    { id: "fireworkSpawnProb", decimals: 3, setter: (v) => firework_spawn_prob = v },
    { id: "numParticles", decimals: 0, setter: (v) => num_particles = v },
    { id: "speedFirework", decimals: 1, setter: (v) => speed_firework = v },
    { id: "speedParticle", decimals: 2, setter: (v) => speed_particle = v },
    { id: "fireworkRadius", decimals: 0, setter: (v) => firework_radius = v },
    { id: "particleLifetime", decimals: 0, setter: (v) => particle_lifetime = v },
    { id: "gravity", decimals: 4, setter: (v) => gravity = v },
    { id: "particleHistoryLength", decimals: 0, setter: (v) => particle_history_length = v },
    { id: "numStars", decimals: 0, setter: (v) => num_stars = v, callback: createStars },
];

function setupControl(config) {
    const input = document.getElementById(config.id);
    input.addEventListener("input", (e) => {
        const value = config.decimals > 0 ? parseFloat(e.target.value) : parseInt(e.target.value);
        config.setter(value);
        const formatted = config.decimals > 0 ? value.toFixed(config.decimals) : value.toString();
        document.getElementById(config.id + "Value").textContent = formatted;
        config.callback?.();
    });
}

function setupControls() {
    controlConfig.forEach(setupControl);
}

setupControls();

</script> </article> </div> </div> <footer class="fixed-bottom" role="contentinfo"> <div class="container mt-0"> © Copyright 2026 Pavan C. Thodima. Powered by <a href="https://jekyllrb.com/" target="_blank" rel="external nofollow noopener">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio" rel="external nofollow noopener" target="_blank">al-folio</a> theme. </div> </footer> <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script> <script src="/assets/js/bootstrap.bundle.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" integrity="sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha256-Nn1q/fx0H7SNLZMQ5Hw5JLaTRZp0yILA/FRexe19VdI=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/imagesloaded@5.0.0/imagesloaded.pkgd.min.js" integrity="sha256-htrLFfZJ6v5udOG+3kNLINIKh2gvoKqwEhHYfTTMICc=" crossorigin="anonymous"></script> <script defer src="/assets/js/masonry.js?a0db7e5d5c70cc3252b3138b0c91dcaf" type="text/javascript"></script> <script defer src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" integrity="sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc=" crossorigin="anonymous"></script> <script defer src="/assets/js/zoom.js?85ddb88934d28b74e78031fd54cf8308"></script> <script src="/assets/js/no_defer.js?2781658a0a2b13ed609542042a859126"></script> <script defer src="/assets/js/common.js?e0514a05c5c95ac1a93a8dfd5249b92e"></script> <script defer src="/assets/js/copy_code.js?c8a01c11a92744d44b093fc3bda915df" type="text/javascript"></script> <script defer src="/assets/js/jupyter_new_tab.js?d9f17b6adc2311cbabd747f4538bb15f"></script> <script async src="https://d1bxh8uas1mnw7.cloudfront.net/assets/embed.js"
